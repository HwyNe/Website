<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1725">
<title>HwyNe | Muhammed Emin Karkın</title>
<meta name="description" content="HwyNe (Muhammed Emin Karkın) — ofansif güvenlik araştırmacısı, CTF oyuncusu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:wght@400;500;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1725;--bg2:#221e31;--line:#352f4a;--tx:#f0ebf6;--mu:#a59db9;--ac:#c9a0ff;--hl:#ffd27a;--sans:'DM Sans',system-ui,sans-serif;--disp:'Syne','DM Sans',sans-serif;--mono:'DM Mono','Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.7 var(--sans);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--hl);outline-offset:3px}
.shell{display:grid;grid-template-columns:220px 1fr;max-width:1260px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;height:100dvh;padding:2.5rem 1.5rem;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.logo{font:800 1.5rem var(--disp);letter-spacing:-.03em}
.rail nav{display:flex;flex-direction:column;gap:.3rem;position:relative}
.rail nav a{font:400 .9rem var(--mono);color:var(--mu);padding:.3rem 0;transition:color .2s,padding .2s}
.rail nav a:hover{color:var(--tx)}
.rail nav a.on{color:var(--hl);padding-left:.6rem}
.lang{align-self:flex-start;font:500 .8rem var(--mono);color:var(--tx);background:none;border:1px solid var(--line);padding:.4rem .8rem;border-radius:99px;cursor:pointer}
.lang:hover{border-color:var(--hl)}
main{padding:0 3rem;min-width:0}
section{padding:6rem 0 3rem;scroll-margin-top:0}
#hakkimda{padding-top:4.5rem}
.sh{font:400 .9rem var(--mono);color:var(--hl);margin-bottom:.8rem}
h2{font:800 clamp(2rem,4.5vw,3.4rem)/1.05 var(--disp);letter-spacing:-.03em;margin-bottom:2rem;overflow-wrap:anywhere}
.big{font:800 clamp(3.6rem,14vw,10rem)/.85 var(--disp);letter-spacing:-.06em;color:var(--ac);animation:up .9s both}
.nm{font:500 1.3rem var(--sans);margin:1.2rem 0 .3rem}.rl{color:var(--mu);max-width:46ch}
pre{margin-top:2.5rem;background:var(--bg2);border-left:3px solid var(--hl);padding:1.4rem 1.6rem;font:400 .88rem/1.8 var(--mono);overflow-x:auto;max-width:640px;animation:up .9s .2s both;-webkit-overflow-scrolling:touch}
pre .c{color:#a59db9}pre .k{color:var(--ac)}pre .s{color:#9de6c4}pre .v{color:var(--hl)}
.cur{display:inline-block;width:.55em;height:1em;background:var(--hl);vertical-align:-.15em;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(20px)}}
.about{max-width:60ch;font-size:1.15rem;margin-top:4rem}.about h3{font:800 1.6rem var(--disp);margin-bottom:.8rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--bg);padding:1.8rem;min-width:0}.tile:first-child{grid-column:1/-1;display:flex;gap:2rem;align-items:flex-end;flex-wrap:wrap}.tile:last-child{grid-column:1/-1}
.tile b{display:block;font:800 clamp(3.5rem,8vw,5.5rem)/.9 var(--disp);letter-spacing:-.05em;color:var(--hl)}
.tile h3{font:700 1.25rem var(--sans);margin:.8rem 0 .2rem}.tile:first-child h3{margin-top:0}.tile p{color:var(--mu);font:400 .85rem var(--mono)}.tile .m{margin-top:1rem;font:400 .8rem var(--mono);color:var(--ac)}
h4{font:700 1.1rem var(--sans);margin:3rem 0 1rem}
.row{display:grid;grid-template-columns:1fr auto auto;gap:1.5rem;padding:.9rem 0;border-bottom:1px solid var(--line);align-items:baseline}.row span{font:400 .85rem var(--mono);color:var(--mu)}.row i{font:500 .82rem var(--mono);font-style:normal;color:var(--ac)}
.lead{color:var(--mu);max-width:56ch;margin:-1rem 0 2rem}.chip{font:500 .78rem var(--mono);border:1px solid var(--hl);color:var(--hl);border-radius:99px;padding:.1rem .7rem}.row i.chip{color:var(--hl)}
.note{margin-top:1.2rem;font:400 .8rem var(--mono);color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:1rem}.card{background:var(--bg2);padding:1.5rem;border-radius:4px;border-top:2px solid var(--line);transition:border-color .2s}a.card{display:block}a.card:hover{border-color:var(--hl)}.card h3{font:700 1.1rem var(--sans);margin-bottom:.3rem}.card p{color:var(--mu);font-size:.92rem}.card .m{margin-top:.9rem;font:400 .78rem var(--mono);color:var(--hl)}
.mail{display:block;max-width:100%;font:800 clamp(1.15rem,4.2vw,3rem)/1.15 var(--disp);letter-spacing:-.03em;overflow-wrap:anywhere;background:none;border:0;color:var(--tx);text-align:left;cursor:pointer;transition:color .2s;padding:.3rem 0}.mail:hover{color:var(--hl)}.cm{font:400 .8rem var(--mono);color:var(--mu);margin:.6rem 0 2.5rem}
.soc{display:flex;gap:1rem 2rem;flex-wrap:wrap;font:500 1rem var(--mono)}.soc a{border-bottom:1px solid var(--line);padding:.5rem 0 .2rem;transition:border-color .2s,color .2s}.soc a:hover{color:var(--hl);border-color:var(--hl)}footer{padding:4rem 0 2rem;font:400 .8rem var(--mono);color:var(--mu)}
@media(max-width:860px){
.shell{grid-template-columns:minmax(0,1fr)}.rail{position:sticky;top:0;z-index:9;height:auto;flex-direction:row;align-items:center;gap:.6rem;padding:calc(.4rem + env(safe-area-inset-top,0px)) calc(.8rem + env(safe-area-inset-right,0px)) .4rem calc(.8rem + env(safe-area-inset-left,0px));background:rgba(26,23,37,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0;border-bottom:1px solid var(--line);min-width:0;width:100%}.rail .logo{display:none}.rail nav{flex-direction:row;overflow-x:auto;flex:1 1 0;min-width:0;gap:.2rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;order:1}.rail nav::-webkit-scrollbar{display:none}.rail nav a{white-space:nowrap;padding:.7rem .6rem;min-height:44px;display:flex;align-items:center}.rail nav a.on{padding-left:.6rem}.lang{order:2;min-height:40px;min-width:44px;flex-shrink:0;align-self:center}
main{min-width:0;width:100%;padding:0 calc(1.3rem + env(safe-area-inset-right,0px)) 0 calc(1.3rem + env(safe-area-inset-left,0px))}section{padding:4rem 0 1rem;scroll-margin-top:80px}#hakkimda{padding-top:2.5rem}.about{margin-top:3rem;font-size:1.05rem}.tiles{grid-template-columns:1fr}.tile:first-child{gap:1rem;align-items:flex-start}.row{grid-template-columns:1fr auto;gap:.3rem 1rem;align-items:center}.row>div{grid-column:1}.row>span{grid-column:1/-1;grid-row:2}.row>i.chip{grid-column:2;grid-row:1}.row>i:not(.chip){grid-column:1/-1;grid-row:3}footer{padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}}
@media(max-width:480px){.nm{font-size:1.15rem}pre{width:100%;margin-top:2rem;padding:1rem 1.1rem;font-size:.76rem;line-height:1.7;margin-left:0}.tile{padding:1.3rem}h2{margin-bottom:1.5rem}.about h3{font-size:1.4rem}.lead{margin-top:-.6rem}.card{padding:1.2rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<noscript>Bu site JavaScript gerektirir. / This site requires JavaScript.</noscript>
<script>
(()=>{
'use strict';
const IDS=['hakkimda','bulgular','projeler','iletisim'];
const L={mail:'muhammedeminkarkin@gmail.com',gh:'https://github.com/HwyNe',li:'https://www.linkedin.com/in/muhammed-emin-karkin-0479112a0',ig:'https://www.instagram.com/muhammedeminkarkin/'};
const R=[
{p:'Optus',s:'P5'}, {p:'Origin Energy',s:'P5'}, {p:'Under Armour Engineering',s:'P5'}, {p:'20minuten',s:'P4'}, {p:'Tesla',s:'P5'}];
const T={tr:{
nav:['Hakkımda','Doğrulanmış Bulgular','Projeler','İletişim'],
name:'Muhammed Emin Karkın',role:"Ofansif güvenlik araştırmacısı. Pendik İTO’da lise öğrencisi.",
who:{kullanici:'HwyNe',isim:'Muhammed Emin Karkın',rol:'Ofansif güvenlik araştırmacısı',okul:'Pendik İTO Ticaret MTAL — Yazılım',konum:'İstanbul, TR',odak:['Web güvenliği','Mobil güvenlik','Tersine mühendislik','Adli bilişim'],saha:'PİTO EduBounty · aktif katılımcı',ilke:'Açığı bul, kök nedenini anla, doğru raporla.'},
ah:'Ben kimim',about:"Web güvenliği ve zafiyet analizine odaklanan bir lise öğrencisiyim. Bir sistemi kırmadan önce nasıl çalıştığını anlamaya çalışırım: önce mimari, sonra kök neden, en sonda rapor. CTF’lerde pratik yapıyor, bug bounty programlarında sorumlu bildirim ilkesiyle çalışıyorum.",
h:['Ben kimim','Doğrulanmış Bulgular','Projeler','İletişim'],cert:'Sertifikalar · BTK Akademi',kod:'Kod',verified:'Doğrulandı',
sp:"PİTO EduBounty’de aktif katılımcıyım. Raporlarımı Bugcrowd üzerinden iletiyorum.",note:'Teknik detaylar, programların açıklama politikası gereği burada paylaşılmıyor.',
pr:[['GitHub','github.com/HwyNe · tüm kodlarım',L.gh],['Yazı arşivi','CTF çözümlerim ve yöntem notlarım burada toplanacak.',''],['Araçlar','Kendi yazdığım küçük Python betikleri.','']],soon:'Yakında',ct:'Bir bulgu, iş birliği ya da CTF takımı için yaz.',cp:'Tıkla, e-postayı kopyala',cd:'Kopyalandı',fail:'Kopyalanamadı. E-posta adresini seçip kopyalayabilirsin.',foot:'Tüm hakları saklıdır.',navLabel:'Ana menü',switchLabel:'Switch to English'},
en:{nav:['About','Verified Findings','Projects','Contact'],name:'Muhammed Emin Karkın',role:'Offensive security researcher. High school student at Pendik ITO.',
who:{user:'HwyNe',name:'Muhammed Emin Karkın',role:'Offensive security researcher',school:'Pendik ITO Vocational HS — Software',location:'Istanbul, TR',focus:['Web security','Mobile security','Reverse engineering','Digital forensics'],field:'PİTO EduBounty · active participant',principle:'Find the bug, understand the root cause, report it right.'},
ah:'Who am I',about:"I'm a high school student focused on web security and vulnerability analysis. Before breaking a system I try to understand how it works: architecture first, root cause next, report last. I practice in CTFs and work on bug bounty programs under responsible disclosure.",
h:['Who am I','Verified Findings','Projects','Contact'],cert:'Certificates · BTK Akademi',kod:'Code',verified:'Verified',sp:"I'm an active participant in PİTO EduBounty and submit my reports through Bugcrowd.",note:"Technical details aren't shared here, following each program's disclosure policy.",
pr:[['GitHub','github.com/HwyNe · all my code',L.gh],['Write-up archive','My CTF solutions and method notes will live here.',''],['Tools','Small Python scripts I wrote myself.','']],soon:'Soon',ct:'Write for a finding, a collab or a CTF team.',cp:'Click to copy email',cd:'Copied',fail:'Could not copy. You can select and copy the email address.',foot:'All rights reserved.',navLabel:'Main navigation',switchLabel:'Türkçeye geç'}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved;try{saved=localStorage.getItem('lang')}catch(e){}
let lang=['tr','en'].includes(saved)?saved:((navigator.language||'').startsWith('tr')?'tr':'en');
const q=s=>`<span class="s">${esc(JSON.stringify(s))}</span>`;
const who=o=>`<span class="c"># whois hwyne</span>\n<span class="v">hwyne</span> = {\n`+Object.entries(o).map(([k,v])=>`    <span class="k">"${esc(k)}"</span>: `+(Array.isArray(v)?`[\n${v.map(x=>'        '+q(x)).join(',\n')}\n    ]`:q(v))).join(',\n')+'\n}<span class="cur" aria-hidden="true"></span>';
const sec=(id,t,k,body,lead)=>`<section id="${id}" aria-labelledby="title-${id}"><div class="sh">// ${esc(t.nav[k])}</div><h2 id="title-${id}">${esc(t.h[k])}</h2>${lead?`<p class="lead">${esc(lead)}</p>`:''}${body}</section>`;
let scrollFrame=0;
function updateNav(){
 const marker=window.innerWidth<=860?100:window.innerHeight*.4;
 let active=IDS[0];
 for(const id of IDS){if(document.getElementById(id).getBoundingClientRect().top<=marker)active=id;}
 if(window.scrollY>40&&Math.ceil(window.scrollY+window.innerHeight)>=document.documentElement.scrollHeight-2)active=IDS[IDS.length-1];
 const nav=$('.rail nav');
 document.querySelectorAll('[data-s]').forEach(a=>{
   const on=a.dataset.s===active,changed=on&&!a.classList.contains('on');
   a.classList.toggle('on',on);
   if(on)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');
   if(changed&&nav.scrollWidth>nav.clientWidth)nav.scrollTo({left:a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
 });
}
function scheduleNav(){if(!scrollFrame)scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;updateNav()})}
function fallbackCopy(){
 const area=document.createElement('textarea');area.value=L.mail;area.readOnly=true;
 area.style.cssText='position:fixed;top:0;left:-9999px;opacity:0';document.body.append(area);
 try{area.select();area.setSelectionRange(0,area.value.length);return document.execCommand('copy')}finally{area.remove();$('#cp').focus({preventScroll:true})}
}
function draw(){
 const t=T[lang];
 document.documentElement.lang=lang;
 const S=[
 `<section id="hakkimda" aria-labelledby="title-hakkimda"><h1 class="big" id="title-hakkimda">HwyNe</h1><p class="nm">${esc(t.name)}</p><p class="rl">${esc(t.role)}</p><pre tabindex="0" aria-label="whois hwyne">${who(t.who)}</pre><div class="about"><h3>${esc(t.ah)}</h3><p>${esc(t.about)}</p></div></section>`,
 sec('bulgular',t,1,`${R.map(r=>`<div class="row"><div>${esc(r.p)}</div><span>${esc(r.s)} · 2026</span><i class="chip">${esc(t.verified)}</i></div>`).join('')}<p class="note">${esc(t.note)}</p>`,t.sp),
 sec('projeler',t,2,`<div class="g">${t.pr.map(([n,d,url])=>url?`<a class="card" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><h3>${esc(n)}</h3><p>${esc(d)}</p><div class="m">GitHub ↗</div></a>`:`<article class="card"><h3>${esc(n)}</h3><p>${esc(d)}</p><div class="m">${esc(t.soon)}</div></article>`).join('')}</div>`),
 sec('iletisim',t,3,`<button type="button" class="mail" id="cp" aria-describedby="cm">${esc(L.mail)}</button><p class="cm" id="cm" role="status" aria-live="polite">${esc(t.cp)}</p><div class="soc">${[['GitHub',L.gh],['LinkedIn',L.li],['Instagram',L.ig]].map(([n,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a>`).join('')}</div>`,t.ct)
 ];
 $('#app').innerHTML=`<aside class="rail"><a class="logo" href="#hakkimda">HwyNe</a><nav aria-label="${esc(t.navLabel)}">${IDS.map((id,k)=>`<a href="#${id}" data-s="${id}">${esc(t.nav[k])}</a>`).join('')}</nav><button type="button" class="lang" id="lg" aria-label="${esc(t.switchLabel)}">${lang==='tr'?'EN':'TR'}</button></aside><main>${S.join('')}<footer>© ${new Date().getFullYear()} HwyNe · ${esc(t.foot)}</footer></main>`;
 document.title='HwyNe | Muhammed Emin Karkın';
 $('#lg').onclick=()=>{
   const focusLang=document.activeElement===$('#lg');
   lang=lang==='tr'?'en':'tr';try{localStorage.setItem('lang',lang)}catch(e){}
   draw();if(focusLang)$('#lg').focus({preventScroll:true});
 };
 $('#cp').onclick=async()=>{
   const status=$('#cm');let copied=false;
   try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(L.mail);copied=true}}catch(e){}
   if(!copied){try{copied=fallbackCopy()}catch(e){}}
   if(status.isConnected)status.textContent=copied?t.cd:t.fail;
 };
 updateNav();
}
draw();
addEventListener('scroll',scheduleNav,{passive:true});addEventListener('resize',scheduleNav,{passive:true});
if(document.fonts)document.fonts.ready.then(scheduleNav);
})();
</script>
</body>
</html>
